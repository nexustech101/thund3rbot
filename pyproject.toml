[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thund3rbot"
version = "1.0.1"
description = "A minimal embeddable agent framework for Python applications"
requires-python = ">=3.11"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }

authors = [
    { name = "Charles DeFreese" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

keywords = [
    "agents",
    "ai",
    "automation",
    "framework",
    "llm",
    "multi-agent",
    "tools",
]

dependencies = [
    # Core runtime
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
providers = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
]
mcp = [
    "langchain-mcp-adapters>=0.1.0",
    "fastmcp>=2.0.0",
    "mcp>=1.0.0",
]
fastapi = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
cli = [
    "click>=8.1.0",
    "rich>=13.0.0",
]
registers = [
    "registers>=7.3.0",
]
config = [
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]
multimodal = [
    "httpx>=0.27.0",
    "anyio>=4.7.0",
]
skills = [
    "pyyaml>=6.0",
]
all = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "fastmcp>=2.0.0",
    "mcp>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "registers>=7.3.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "anyio>=4.7.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/nexustech101/thund3rbot"
Repository = "https://github.com/nexustech101/thund3rbot"
Issues = "https://github.com/nexustech101/thund3rbot/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "thund3rbot",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
